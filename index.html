<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Biblioteca Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0 25px 0;
            flex-wrap: wrap;
            border-bottom: 3px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: #f7fafc;
            color: #4a5568;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: #edf2f7;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card-dash {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .stat-card-dash i {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 3px;
        }
        .stat-card-dash span {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
        }
        .stat-card-dash label {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .info-box {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .info-box h3 {
            color: #2a4365;
            margin-bottom: 5px;
        }
        .info-box p {
            color: #4a5568;
            margin: 0;
        }
        .estado-activo { color: #48bb78; font-weight: 600; }
        .estado-vencido { color: #fc8181; font-weight: 600; }
        .estado-devuelto { color: #a0aec0; }
        .mensaje {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .mensaje-error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #fc8181;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-book-open"></i> Biblioteca Digital</h1>
            <p>Gestión de libros, usuarios y préstamos</p>
        </header>

        <!-- ESTADÍSTICAS -->
        <div class="dashboard-stats" id="stats">
            <div class="stat-card-dash">
                <i class="fas fa-book"></i>
                <span id="totalLibros">0</span>
                <label>Total Libros</label>
            </div>
            <div class="stat-card-dash">
                <i class="fas fa-user"></i>
                <span id="totalUsuarios">0</span>
                <label>Usuarios</label>
            </div>
            <div class="stat-card-dash">
                <i class="fas fa-clock"></i>
                <span id="prestamosActivos">0</span>
                <label>Préstamos Activos</label>
            </div>
            <div class="stat-card-dash">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="prestamosVencidos">0</span>
                <label>Vencidos</label>
            </div>
        </div>

        <!-- PESTAÑAS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mostrarTab('libros')">
                <i class="fas fa-book"></i> Libros
            </button>
            <button class="tab-btn" onclick="mostrarTab('usuarios')">
                <i class="fas fa-users"></i> Usuarios
            </button>
            <button class="tab-btn" onclick="mostrarTab('prestamos')">
                <i class="fas fa-hand-holding-heart"></i> Préstamos
            </button>
        </div>

        <!-- TAB 1: LIBROS -->
        <div id="tab-libros" class="tab-content active">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar libros...">
                    <button onclick="buscarLibros()"><i class="fas fa-search"></i></button>
                </div>
                <button class="btn btn-primary" onclick="mostrarFormularioLibro()">
                    <i class="fas fa-plus"></i> Agregar Libro
                </button>
            </div>
            <div class="table-container">
                <h2><i class="fas fa-list"></i> Catálogo de Libros</h2>
                <div id="tablaLibros"></div>
            </div>
        </div>

        <!-- TAB 2: USUARIOS -->
        <div id="tab-usuarios" class="tab-content">
            <div class="search-section">
                <button class="btn btn-primary" onclick="mostrarFormularioUsuario()">
                    <i class="fas fa-plus"></i> Agregar Usuario
                </button>
            </div>
            <div class="table-container">
                <h2><i class="fas fa-users"></i> Lista de Usuarios</h2>
                <div id="tablaUsuarios"></div>
            </div>
        </div>

        <!-- TAB 3: PRÉSTAMOS -->
        <div id="tab-prestamos" class="tab-content">
            <div class="info-box">
                <h3><i class="fas fa-info-circle"></i> Información de Préstamos</h3>
                <p>⚠️ Los préstamos se vencen automáticamente después de 15 días.</p>
            </div>
            <div class="table-container">
                <h2><i class="fas fa-list"></i> Todos los Préstamos</h2>
                <div id="tablaPrestamos"></div>
            </div>
        </div>

        <!-- MODALES -->
        <div id="modalLibro" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal('modalLibro')">&times;</span>
                <h2 id="modalTitulo"><i class="fas fa-book"></i> Agregar Libro</h2>
                <form id="formLibro" onsubmit="guardarLibro(event)">
                    <input type="hidden" id="libroId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Título *</label>
                            <input type="text" id="titulo" required>
                        </div>
                        <div class="form-group">
                            <label>Autor *</label>
                            <input type="text" id="autor" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Editorial</label>
                            <input type="text" id="editorial">
                        </div>
                        <div class="form-group">
                            <label>Año</label>
                            <input type="number" id="anio">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>ISBN</label>
                            <input type="text" id="isbn">
                        </div>
                        <div class="form-group">
                            <label>Categoría</label>
                            <input type="text" id="categoria">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Cantidad *</label>
                        <input type="number" id="cantidad" min="1" value="1" required>
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar</button>
                        <button type="button" class="btn btn-danger" onclick="cerrarModal('modalLibro')">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalUsuario" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal('modalUsuario')">&times;</span>
                <h2 id="modalTituloUsuario"><i class="fas fa-user"></i> Agregar Usuario</h2>
                <form id="formUsuario" onsubmit="guardarUsuario(event)">
                    <input type="hidden" id="usuarioId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido *</label>
                            <input type="text" id="apellido" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="telefono">
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="direccion">
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar</button>
                        <button type="button" class="btn btn-danger" onclick="cerrarModal('modalUsuario')">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modalPrestamo" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal('modalPrestamo')">&times;</span>
                <h2><i class="fas fa-hand-holding-heart"></i> Registrar Préstamo</h2>
                <form id="formPrestamo" onsubmit="registrarPrestamo(event)">
                    <input type="hidden" id="prestamoLibroId">
                    <div class="form-group">
                        <label>Libro</label>
                        <input type="text" id="prestamoLibroTitulo" disabled>
                    </div>
                    <div class="form-group">
                        <label>Usuario *</label>
                        <select id="prestamoUsuarioId" required>
                            <option value="">Seleccionar usuario...</option>
                        </select>
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-success"><i class="fas fa-check"></i> Registrar</button>
                        <button type="button" class="btn btn-danger" onclick="cerrarModal('modalPrestamo')">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="script_usuarios.js"></script>
    <script src="script_prestamos.js"></script>
    
    <script>
        function mostrarTab(tab) {
            console.log('✅ Cambiando a:', tab);
            
            var contenidos = document.querySelectorAll('.tab-content');
            for (var i = 0; i < contenidos.length; i++) {
                contenidos[i].classList.remove('active');
            }
            
            var botones = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < botones.length; i++) {
                botones[i].classList.remove('active');
            }
            
            var seleccionada = document.getElementById('tab-' + tab);
            if (seleccionada) {
                seleccionada.classList.add('active');
            }
            
            var botones = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < botones.length; i++) {
                var onclick = botones[i].getAttribute('onclick');
                if (onclick && onclick.indexOf("'" + tab + "'") !== -1) {
                    botones[i].classList.add('active');
                }
            }
            
            if (tab === 'usuarios') {
                if (typeof cargarUsuarios === 'function') cargarUsuarios();
            }
            if (tab === 'prestamos') {
                if (typeof cargarPrestamos === 'function') cargarPrestamos();
                if (typeof cargarEstadisticasPrestamos === 'function') cargarEstadisticasPrestamos();
            }
        }
    </script>
</body>
</html>
